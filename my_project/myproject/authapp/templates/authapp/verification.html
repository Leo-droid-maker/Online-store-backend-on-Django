{% extends 'authapp/base.html' %}

{% block content %}
    {% if user.is_authenticated %}
        <h3>Congrats!</h3>
        <p>User {{ user.username }} is activated</p>
    {% else %}
        <h3>Oops!</h3>
        <p>Activation was not completed</p>
    {% endif %}

    <button class="btn btn-link form-control">
        <a href="{% url 'main' %}">
            Main
        </a>
    </button>
{% endblock %}
